<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>La vitrine lenticulaire — Les Veilleurs</title>
<link rel="stylesheet" href="lv.css">
</head>
<body>
<div id="gate"></div>
<div id="topbar"></div>
<header id="hdr"></header>
<nav id="nav"></nav>
<main>
  <section id="contexte"></section>
  <section id="fiche"></section>
  <section id="principe"></section>
  <section id="montage"></section>
  <section id="vent"></section>
  <section id="fournitures"></section>
  <section id="ouverts"></section>
  <section id="documents"></section>
  <section id="cao"></section>
  <section id="journal"></section>
</main>
<footer id="foot"></footer>
<script src="docs/sizes.js"></script>
<script src="data.js"></script>
<script src="lv.js"></script>
<script>
LV.init(window.DATA, "vitrine", ({t, esc}) => {
  const D = window.DATA, $ = s => document.querySelector(s);
  const img = (src, alt, href) => `<a href="${esc(href || src)}" target="_blank" rel="noopener"><img src="${esc(src)}" alt="${esc(alt || "")}" loading="lazy"></a>`;
  const h2 = (o) => `<h2>${esc(t(o.titre))}${o.sous ? ` <span class="sub">— ${esc(t(o.sous))}</span>` : ""}</h2>`;

  const c = D.contexte;
  $("#contexte").innerHTML = `<p class="lead">${esc(t(D.accroche))}</p>${h2(c)}<p>${esc(t(c.intro))}</p>
    <div class="vues">${c.vues.map(v => `<div class="vue">${img(v.img, t(v.titre), v.pdf)}<div class="body"><b>${esc(t(v.titre))}</b><p>${esc(t(v.legende))}</p></div></div>`).join("")}</div>`;

  const f = D.fiche;
  $("#fiche").innerHTML = `${h2(f)}<div class="kv">${f.items.map(([k, v]) => `<div><b>${esc(t(k))}</b>${esc(t(v))}</div>`).join("")}</div>`;

  const p = D.principe;
  $("#principe").innerHTML = h2(p) + `<p class="lead">${esc(t(p.lead))}</p>` + p.items.map(b => `<h3 id="p-${esc(b.id)}">${esc(t(b.titre))}</h3>
    <div class="bloc"><div><p>${esc(t(b.texte))}</p>${b.pourquoi ? `<p class="note">${esc(t(b.pourquoi))}</p>` : ""}${b.croquis ? `<div class="croquis">${img(b.croquis, t(p.croquis_leg))}${esc(t(p.croquis_leg))}</div>` : ""}</div>
    <div>${b.img ? img(b.img, t(b.titre)) : ""}</div></div>`).join("");

  const m = D.montage;
  $("#montage").innerHTML = `${h2(m)}${img(m.img, t(m.titre))}<ol>${m.etapes.map(e => `<li>${esc(t(e))}</li>`).join("")}</ol><p class="unique">${esc(t(m.unique))}</p>`;

  const w = D.vent;
  $("#vent").innerHTML = `${h2(w)}<p>${esc(t(w.intro))}</p><div class="scroll"><table><tr>${w.colonnes.map(c => `<th>${esc(t(c))}</th>`).join("")}</tr>${w.profils.map(l => `<tr>${l.map(c => `<td>${esc(t(c))}</td>`).join("")}</tr>`).join("")}</table></div>
    <ul class="pts">${w.conclusions.map(x => `<li>${esc(t(x))}</li>`).join("")}</ul>
    <div class="vues">${w.imgs.map(i => `<div class="vue">${img(i.src, t(i.leg))}<div class="body"><p>${esc(t(i.leg))}</p></div></div>`).join("")}</div>`;

  const fo = D.fournitures;
  $("#fournitures").innerHTML = h2(fo) + `<p class="lead">${esc(t(fo.lead))}</p>` + fo.groupes.map(g => `<h3 class="groupe">${esc(t(g.groupe))}</h3><div class="cards">${g.items.map(i => `<div class="card"><div class="body">
      <h4>${esc(t(i.nom))}</h4>${i.statut ? `<span class="badge reco">${esc(t(i.statut))}</span>` : ""}<p>${esc(t(i.detail))}</p>${i.ref ? `<div class="ref">${esc(i.ref)}</div>` : ""}
      <div class="links">${i.url ? `<a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(t(fo.lien))}</a>` : ""}</div></div></div>`).join("")}</div>`).join("");

  $("#ouverts").innerHTML = `${h2(D.ouverts)}<ul class="pts">${D.ouverts.items.map(x => `<li>${esc(t(x))}</li>`).join("")}</ul>`;

  $("#cao").innerHTML = `${h2(D.cao)}<p class="leg">${esc(t(D.cao.note))}</p><pre id="prompt">${esc(D.cao.texte)}</pre><button class="copy" data-src="prompt"></button>`;
});
</script>
</body>
</html>
